name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (e.g. v1.2.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Lint, typecheck, tests and format, in parallel with the build: `merge` waits for both,
  # so a failing check tags no image and publishes no release.
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  # One native runner per platform, in parallel. Each pushes its image by digest only;
  # `merge` then tags both digests as one multi-platform image; `cleanup` deletes them when it
  # doesn't get to.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io only takes lowercase names; github.repository keeps the owner's casing.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [quality, build]
    runs-on: ubuntu-24.04
    steps:
      # ghcr.io only takes lowercase names; github.repository keeps the owner's casing.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  # A failed check or platform build leaves the digests already pushed untagged: delete them,
  # with the manifests they point to (platform image, attestation). A cached rebuild can
  # reproduce a released digest, so anything a tagged version still reaches is kept.
  cleanup:
    needs: [quality, build, merge]
    if: always() && needs.build.result != 'skipped' && needs.merge.result != 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete this run's digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: /${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions
        run: |
          shopt -s nullglob
          pushed=("$RUNNER_TEMP"/digests/*)
          if [ ${#pushed[@]} -eq 0 ]; then
            echo "Nothing was pushed."
            exit 0
          fi

          # A digest and, recursively, every manifest it lists (index first).
          tree() {
            echo "$1"
            for child in $(docker buildx imagetools inspect --raw "$IMAGE@$1" | jq -r '.manifests[]?.digest'); do
              tree "$child"
            done
          }

          gh api --paginate "$VERSIONS" --jq '.[] | [.id, .name, (.metadata.container.tags | length)] | @tsv' > versions.tsv
          keep="$(awk -F'\t' '$3 > 0 { print $2 }' versions.tsv | while read -r digest; do tree "$digest"; done)"

          for file in "${pushed[@]}"; do
            for digest in $(tree "sha256:$(basename "$file")"); do
              if grep -qxF "$digest" <<< "$keep"; then
                echo "Keeping $digest: a tagged image uses it."
                continue
              fi
              id="$(awk -F'\t' -v d="$digest" '$2 == d { print $1 }' versions.tsv)"
              if [ -n "$id" ]; then
                gh api -X DELETE "$VERSIONS/$id"
                echo "Deleted $digest"
              fi
            done
          done

  # The GitHub release the collector's update check reads (`releases/latest`). Tag pushes
  # only: a manual run rebuilds an image, it doesn't publish a version.
  release:
    needs: merge
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The API reports apps/api/package.json's version as the running one: a tag that
      # doesn't match it would announce an update to itself forever.
      - name: Check the tag against the API version
        run: |
          version="$(jq -r .version apps/api/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/api/package.json ($version)"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
