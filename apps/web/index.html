<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Self-hosted dashboard for @nestjs/observe telemetry"
    />
    <title>Observe</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash.
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('observe-theme') || 'dark';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          display: flex;
          min-height: 100vh;
          align-items: center;
          justify-content: center;
          padding: 24px;
          font-family: system-ui, sans-serif;
          background: #0a0a0a;
          color: #e5e5e5;
        "
      >
        <div style="max-width: 28rem">
          <h1 style="font-size: 1.125rem; margin: 0 0 8px">
            JavaScript is turned off
          </h1>
          <p style="margin: 0; color: #a3a3a3; line-height: 1.5">
            This dashboard needs JavaScript. Allow it for this site in your
            browser settings (or the extension that blocks it) and reload the
            page.
          </p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
